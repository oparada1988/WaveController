name: Build Linux Packages (.deb & .rpm)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian / Ubuntu Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev rsync

      - name: Build Debian Package
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh --deb

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavecontroller-deb
          path: dist/*.deb

  build-rpm:
    name: Build Fedora / RHEL Package (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Build Tools
        run: |
          dnf install -y rpm-build systemd-rpm-macros python3 tar git rsync findutils

      - name: Mark Git Directory Safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build RPM Package
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh --rpm

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavecontroller-rpm
          path: dist/*.rpm

  publish-assets:
    name: Attach Packages to GitHub Release
    needs: [build-deb, build-rpm]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Debian Artifact
        uses: actions/download-artifact@v4
        with:
          name: wavecontroller-deb
          path: release_dist

      - name: Download RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: wavecontroller-rpm
          path: release_dist

      - name: Generate Checksums
        run: |
          cd release_dist
          sha256sum *.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Uploading release assets for tag: $TAG"
          if ! gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG does not exist yet. Creating release draft..."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release_dist/* --clobber
