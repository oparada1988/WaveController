<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Multi-channel mixer faders representing All Channels -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Channel 1 Track & Thumb -->
    <line x1="3.5" y1="2" x2="3.5" y2="14" opacity="0.65" />
    <circle cx="3.5" cy="5.5" r="2" fill="currentColor" />

    <!-- Channel 2 Track & Thumb -->
    <line x1="8" y1="2" x2="8" y2="14" opacity="0.65" />
    <circle cx="8" cy="10.5" r="2" fill="currentColor" />

    <!-- Channel 3 Track & Thumb -->
    <line x1="12.5" y1="2" x2="12.5" y2="14" opacity="0.65" />
    <circle cx="12.5" cy="7" r="2" fill="currentColor" />
  </g>
</svg>
