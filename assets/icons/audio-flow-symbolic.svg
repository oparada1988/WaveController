<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#dfdfdf; }
    </style>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor">
    <!-- Top-left node (Channel 1 Input) -->
    <path fill-rule="evenodd" d="M 3 1.5 A 2 2 0 1 0 3 5.5 A 2 2 0 1 0 3 1.5 Z M 3 2.6 A 0.9 0.9 0 1 1 3 4.4 A 0.9 0.9 0 1 1 3 2.6 Z"/>
    
    <!-- Bottom-left node (Channel 2 Input) -->
    <path fill-rule="evenodd" d="M 3 10.5 A 2 2 0 1 0 3 14.5 A 2 2 0 1 0 3 10.5 Z M 3 11.6 A 0.9 0.9 0 1 1 3 13.4 A 0.9 0.9 0 1 1 3 11.6 Z"/>

    <!-- Center node (Mixer Bus) -->
    <path fill-rule="evenodd" d="M 8 6 A 2 2 0 1 0 8 10 A 2 2 0 1 0 8 6 Z M 8 7.1 A 0.9 0.9 0 1 1 8 8.9 A 0.9 0.9 0 1 1 8 7.1 Z"/>

    <!-- Right node (Output Sink) -->
    <path fill-rule="evenodd" d="M 13 6 A 2 2 0 1 0 13 10 A 2 2 0 1 0 13 6 Z M 13 7.1 A 0.9 0.9 0 1 1 13 8.9 A 0.9 0.9 0 1 1 13 7.1 Z"/>

    <!-- Connecting Routing Wires -->
    <polygon points="3.87,5.22 6.05,7.18 6.98,6.14 4.81,4.18"/>
    <polygon points="4.81,11.82 6.98,9.86 6.05,8.82 3.87,10.78"/>

