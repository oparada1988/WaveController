# WaveController — Elgato Wave XLR (0fd9:007d) & Wave:3 (0fd9:0070) Studio Profile
# Prevents PipeWire idle suspend, eliminates shared-clock reset clicks, and locks 48kHz clock.

context.properties = {
  default.clock.rate = 48000
  default.clock.allowed-rates = [ 48000 ]
  default.clock.quantum = 512
  default.clock.min-quantum = 32
  default.clock.max-quantum = 1024
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_.*" }
      { node.name = "~alsa_output.usb-Elgato_Systems_Elgato_Wave_.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        audio.rate = 48000
        priority.driver = 1000
        priority.session = 1000
      }
    }
  }
]
